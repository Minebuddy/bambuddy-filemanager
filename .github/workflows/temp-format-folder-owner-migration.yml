name: TEMP Format Folder Owner Migration

on:
  push:
    branches: [feature/library-access-control]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/library-access-control

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pinned Ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Format migration files
        run: |
          ruff format \
            backend/app/core/database.py \
            backend/tests/unit/test_library_folder_owner_backfill_migration.py

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/core/database.py \
            backend/tests/unit/test_library_folder_owner_backfill_migration.py
          git commit -m "Format folder owner migration with Ruff"
          git push origin HEAD:feature/library-access-control
