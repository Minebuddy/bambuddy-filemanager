services:
  bambuddy-test:
    build:
      context: .
      dockerfile: Dockerfile.portainer-test
      args:
        BAMBUDDY_BUILD_BRANCH: feature/library-access-control

    # This image is built locally from the Git checkout. Portainer's
    # "Pull and redeploy" runs docker compose pull first, so explicitly prevent
    # Compose from trying to fetch this local-only tag from a registry.
    image: bambuddy-filemanager:test
    pull_policy: never
    container_name: bambuddy-filemanager-test

    cap_add:
      - NET_BIND_SERVICE

    # Keep the test instance isolated from the production host-network stack.
    ports:
      - "18109:8000"

    volumes:
      - /local/bambuddy-filemanager-test/data:/app/data:rw
      - /local/bambuddy-filemanager-test/logs:/app/logs:rw
      - /local/bambuddy-filemanager-test/virtual_printer:/app/data/virtual_printer:rw

    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=100
      - PORT=8000

    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

    restart: on-failure:5
