services:
  bambuddy-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bambuddy-filemanager-test
    restart: unless-stopped

    # Bridge mode keeps this isolated from any production Bambuddy instance.
    # Printer discovery will not work in this test stack; add a printer manually
    # by IP if you need printer-facing tests.
    ports:
      - "18000:8000"

    volumes:
      - bambuddy_filemanager_test_data:/app/data
      - bambuddy_filemanager_test_logs:/app/logs

    environment:
      - TZ=Europe/Amsterdam
      - PUID=1000
      - PGID=1000
      - PORT=8000

    stop_grace_period: 30s

volumes:
  bambuddy_filemanager_test_data:
  bambuddy_filemanager_test_logs:
